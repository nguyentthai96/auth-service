# Local Model Configuration
# Models chạy trên máy local để tiết kiệm chi phí cho simple tasks

# Cài đặt bằng Ollama (recommended):
#   curl -fsSL https://ollama.com/install.sh | sh
#   ollama pull qwen2.5:7b
#   ollama pull deepseek-coder-v2:16b
#   ollama pull llama3.1:8b

models:
  local-qwen:
    provider: ollama
    model: "qwen2.5:7b"
    endpoint: "http://localhost:11434"
    max_context: 32768
    best_for:
      - "Formatting and restructuring text"
      - "Template filling"
      - "Decision log entries"
      - "Cross-reference validation"
      - "Simple Q&A"
    not_for:
      - "Complex architecture decisions"
      - "Multi-agent debate"
      - "Code generation"
    speed: "fast"
    quality: "adequate for simple tasks"
    cost: "free"

  local-deepseek:
    provider: ollama
    model: "deepseek-coder-v2:16b"
    endpoint: "http://localhost:11434"
    max_context: 65536
    best_for:
      - "Code-related formatting"
      - "API schema generation"
      - "Validation rule templates"
      - "ERD to DDL conversion"
    not_for:
      - "Business analysis"
      - "Creative writing"
      - "Multi-agent debate"
    speed: "medium"
    quality: "good for code tasks"
    cost: "free"

  local-llama:
    provider: ollama
    model: "llama3.1:8b"
    endpoint: "http://localhost:11434"
    max_context: 131072
    best_for:
      - "Documentation writing"
      - "Summarization"
      - "General formatting"
    not_for:
      - "Complex reasoning"
      - "Architecture decisions"
    speed: "fast"
    quality: "adequate"
    cost: "free"

# Cloud models (via Antigravity / API)
cloud_models:
  opus:
    provider: antigravity
    model: "claude-opus"
    tier: high
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    best_for:
      - "Architecture debate"
      - "Technology analysis"
      - "Complex decision-making"
      - "Multi-agent orchestration"

  sonnet:
    provider: antigravity
    model: "claude-sonnet"
    tier: mid
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    best_for:
      - "BRD document generation"
      - "Tech design writing"
      - "Code generation"
      - "Test writing"

# Fallback chain
fallback_chain:
  low: ["local-qwen", "local-deepseek", "local-llama", "sonnet"]
  mid: ["sonnet", "opus"]
  high: ["opus", "sonnet"]

# Health check
health_check:
  command: "curl -s http://localhost:11434/api/tags | jq '.models[].name'"
  interval: "before_pipeline_start"
  on_failure: "fallback to cloud models, log warning"
