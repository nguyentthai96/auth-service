# Error Recovery Configuration
# Used by /wf_e2e orchestrator for automatic error handling

retry_policy:
  default:
    max_retries: 3
    backoff: "none"  # immediate retry for LLM tasks
    on_exhausted: "stop_and_report"

  per_phase:
    wf_ideate:
      max_retries: 2
      on_failure: "skip_to_manual_research"
      critical: false

    wf_brd:
      max_retries: 2
      on_failure: "stop_and_escalate"
      critical: true
      quality_gate:
        max_revision_cycles: 2
        on_reject: "stop_and_escalate"

    wf_tech_design:
      max_retries: 2
      on_failure: "stop_and_escalate"
      critical: true
      quality_gate:
        max_revision_cycles: 2
        on_reject: "stop_and_escalate"

    wf_ui_design:
      max_retries: 2
      on_failure: "continue_without_mockups"
      critical: false
      notes: "UI docs are useful but not blocking for code gen"

    code_generation:
      max_retries: 3
      on_failure: "partial_generation"
      critical: true
      build_check:
        command: "./gradlew build -x test"
        on_failure: "fix_and_retry"
        max_fix_attempts: 3

    auto_test:
      max_retries: 2
      on_failure: "continue_with_partial_tests"
      critical: false
      notes: "Partial tests are better than no tests"

    deployment:
      max_retries: 2
      on_failure: "rollback_and_report"
      critical: false
      notes: "Code gen is valuable even without deployment"

# Budget exhaustion handling
budget:
  warning_threshold: 0.80  # 80% used
  critical_threshold: 0.95  # 95% used
  on_warning: "downgrade_remaining_tasks"
  on_critical: "pause_and_report"
  allow_override: true  # user can approve additional budget

# Human escalation triggers
escalation:
  triggers:
    - "quality_gate_rejected_twice"
    - "build_fails_after_3_fixes"
    - "autonomous_deliberation_tier3"
    - "budget_exceeded"
    - "security_vulnerability_detected"
  on_escalation:
    - "save_checkpoint"
    - "generate_status_report"
    - "notify_user"
    - "wait_for_human_response"

# Checkpoint configuration
checkpoints:
  save_at: "phase_boundary"
  format: "html_comment"  # <!-- e2e_checkpoint: {...} -->
  location: "project_docs/{project}/e2e_checkpoint.md"
  includes:
    - "completed_phases"
    - "current_phase"
    - "total_tokens_used"
    - "last_commit_hash"
    - "started_at"
    - "decisions_made"
