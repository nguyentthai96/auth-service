total:
  all_pipelines_budget: 1390000  # ~1.4M tokens
  estimated_cost_all_cloud: "$34.00"
  estimated_cost_mixed_model: "$19.00"
  savings_with_mixed: "~44%"

# Cost optimization strategies
strategies:
  - name: "Local-first for low-tier"
    savings: "~25%"
    description: "Route formatting, templates, logging to local models"

  - name: "Mid-tier for most generation"
    savings: "~15%"
    description: "Use Sonnet instead of Opus for doc generation"

  - name: "Budget alerts at 80%"
    savings: "~5%"
    description: "Downgrade remaining tasks when budget runs low"

  - name: "Cache repeated patterns"
    savings: "~10%"
    description: "Reuse templates, skip regeneration of unchanged sections"
