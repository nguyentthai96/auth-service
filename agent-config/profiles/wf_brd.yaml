# Pipeline: /wf_brd — BRD Generation
# Budget: High (multi-agent debates are token-heavy)

pipeline:
  name: wf_brd
  description: "BRD Generation + Multi-Agent Debate pipeline"
  total_budget_tokens: 300000

tasks:
  research-ingest:
    description: "Read and process ideation output"
    max_tokens: 5000
    model_tier: low
    priority: speed

  generate-brd-00-02:
    description: "Generate overview, stakeholders, workflows"
    max_tokens: 30000
    model_tier: mid
    priority: balanced

  generate-brd-03-05:
    description: "Generate FRs, business rules, state machines"
    max_tokens: 40000
    model_tier: mid
    priority: quality
    notes: "FRs need careful Given/When/Then, state machines need completeness"

  generate-brd-06-08:
    description: "Generate domain model, NFR/risk, acceptance"
    max_tokens: 30000
    model_tier: mid
    priority: balanced

  debate-architecture:
    description: "5-agent architecture pattern debate"
    max_tokens: 50000
    model_tier: high
    priority: quality
    notes: "Critical decision — worth the token investment"

  debate-technology:
    description: "5-agent technology stack analysis"
    max_tokens: 50000
    model_tier: high
    priority: quality
    notes: "Per-layer evaluation, competitor tech insights"

  debate-flow-logic:
    description: "5-agent flow logic validation"
    max_tokens: 40000
    model_tier: high
    priority: quality
    notes: "Edge cases, rollback, idempotency — needs deep reasoning"

  cross-reference:
    description: "FR→BR, FR→WF, SM→Entity validation"
    max_tokens: 10000
    model_tier: low
    priority: speed
    notes: "Mechanical checking, regex-like"

  quality-gate:
    description: "Arbiter final review"
    max_tokens: 15000
    model_tier: mid
    priority: balanced

  revision-cycle:
    description: "Fix issues from quality gate (if needed)"
    max_tokens: 20000
    model_tier: mid
    priority: balanced
    notes: "May not be used if quality gate passes first time"

  decision-logging:
    description: "Log decisions to decision_log.md"
    max_tokens: 5000
    model_tier: low
    priority: speed

  cost-report:
    description: "Generate pipeline cost report"
    max_tokens: 5000
    model_tier: low
    priority: speed

model_routing:
  high:
    primary: "opus"
    fallback: "sonnet"
  mid:
    primary: "sonnet"
    fallback: "gpt-4o-mini"
  low:
    primary: "local-qwen"
    fallback: "local-deepseek"
    fallback_cloud: "sonnet"
