# Pipeline: /wf_e2e (code-generator + auto-test-generator phase)
# Budget: Medium (mid-tier dominant for code generation)

pipeline:
  name: wf_code_gen
  description: "Code Generation + Auto Test Generation"
  total_budget_tokens: 200000

tasks:
  analyze-design:
    description: "Read tech design + UI/UX docs, plan generation order"
    max_tokens: 10000
    model_tier: mid
    priority: balanced

  generate-project-scaffold:
    description: "build.gradle, config classes, directory structure"
    max_tokens: 15000
    model_tier: mid
    priority: balanced

  generate-common-layer:
    description: "Exception hierarchy, BaseResponse, validators"
    max_tokens: 15000
    model_tier: mid
    priority: balanced

  generate-entities:
    description: "JPA entities from domain model"
    max_tokens: 20000
    model_tier: mid
    priority: quality
    notes: "Entity accuracy is critical — maps DDD to JPA"

  generate-repositories:
    description: "Repository interfaces + custom queries"
    max_tokens: 10000
    model_tier: low
    priority: speed
    notes: "Mostly boilerplate"

  generate-services:
    description: "Service classes implementing workflows"
    max_tokens: 30000
    model_tier: mid
    priority: quality
    notes: "Business logic — needs careful workflow mapping"

  generate-controllers-dtos:
    description: "REST controllers + request/response DTOs"
    max_tokens: 25000
    model_tier: mid
    priority: balanced

  generate-migrations:
    description: "Flyway SQL migrations from database design"
    max_tokens: 10000
    model_tier: low
    priority: speed
    notes: "DDL generation is mechanical"

  generate-frontend:
    description: "React/Flutter components + pages"
    max_tokens: 30000
    model_tier: mid
    priority: quality

  generate-unit-tests:
    description: "JUnit 5 unit tests for entities, services, state machines"
    max_tokens: 20000
    model_tier: mid
    priority: balanced

  generate-integration-tests:
    description: "Spring Boot integration tests + Testcontainers"
    max_tokens: 10000
    model_tier: mid
    priority: balanced

  generate-arch-tests:
    description: "ArchUnit architecture rules"
    max_tokens: 5000
    model_tier: low
    priority: speed
    notes: "Template-based"

model_routing:
  high:
    primary: "opus"
    fallback: "sonnet"
  mid:
    primary: "sonnet"
    fallback: "gpt-4o-mini"
  low:
    primary: "local-qwen"
    fallback: "local-deepseek"
    fallback_cloud: "sonnet"
