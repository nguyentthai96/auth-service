# Pipeline: /wf_tech_design — Technical Design
# Budget: Medium-High (multi-agent review + detailed docs)

pipeline:
  name: wf_tech_design
  description: "Technical Design Generation + Multi-Agent Review"
  total_budget_tokens: 250000

tasks:
  context-loading:
    description: "Read BRD + debate artifacts"
    max_tokens: 5000
    model_tier: low
    priority: speed

  generate-system-overview:
    description: "C4 diagrams, architecture overview"
    max_tokens: 25000
    model_tier: mid
    priority: quality
    notes: "C4 diagrams need accuracy, references architecture-debate"

  generate-roles-permissions:
    description: "RBAC matrix, permission model"
    max_tokens: 15000
    model_tier: mid
    priority: balanced

  generate-module-breakdown:
    description: "Module graph, dependency matrix"
    max_tokens: 20000
    model_tier: mid
    priority: balanced

  generate-domain-model:
    description: "DDD aggregates, bounded contexts, value objects"
    max_tokens: 30000
    model_tier: high
    priority: quality
    notes: "DDD requires deep domain understanding"

  generate-database-design:
    description: "ERD, table DDL, indexes, migrations"
    max_tokens: 25000
    model_tier: mid
    priority: quality

  generate-api-design:
    description: "Endpoint catalog, request/response schemas"
    max_tokens: 25000
    model_tier: mid
    priority: quality

  generate-workflows-sequence:
    description: "Sequence diagrams per use case"
    max_tokens: 20000
    model_tier: mid
    priority: balanced

  generate-state-machines:
    description: "Implementation-level state machines"
    max_tokens: 15000
    model_tier: mid
    priority: balanced

  generate-validation-errors:
    description: "Validation rules + error handling"
    max_tokens: 20000
    model_tier: mid
    priority: balanced

  multi-agent-review:
    description: "5-agent tech review (Architect, Security, Performance, Skeptic, Arbiter)"
    max_tokens: 40000
    model_tier: high
    priority: quality
    notes: "Security and performance review — critical for production readiness"

  revision-and-crossref:
    description: "Fix review issues + cross-reference validation"
    max_tokens: 10000
    model_tier: low
    priority: speed

model_routing:
  high:
    primary: "opus"
    fallback: "sonnet"
  mid:
    primary: "sonnet"
    fallback: "gpt-4o-mini"
  low:
    primary: "local-qwen"
    fallback: "local-deepseek"
    fallback_cloud: "sonnet"
