# Pipeline: session-research
# Purpose: Deep research on Session Management patterns for Enterprise IAM
# Scope: Research only — no spec/apply workflows
# Created: 2026-08-17

features:
  - FR-008-session-management

workflows:
  - wf_feature_research

settings:
  progress_file: "openspec/changes/FR-008-session-management/pipeline_progress.yml"

proxy:
  model_routing:
    wf_feature_research: "claude"

# Disable agentic tools — proxy (antigravity-ultra) does not support
# multi-turn tool_result messages in streaming mode.
# Uses legacy single-shot mode: model outputs files as text, orchestrator extracts.
tools:
  enabled: false
  max_output_tokens: 32768
