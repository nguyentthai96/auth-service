# ═══════════════════════════════════════════════════════════
# Pipeline Config: auth-service-batch2
# ═══════════════════════════════════════════════════════════
# Batch 2: Event-driven features, cache migration, JWT validation, TPS testing
# Full workflow chain: research → pre_openspec → brainstorm → openspec → apply → archive
# ═══════════════════════════════════════════════════════════

# ─── SDK Configuration ───────────────────────────────────────
sdk_mode: "claude"
model: "claude-opus-4-6"

# ─── Features to Process ────────────────────────────────────
features:
  - cache-starter-migration-upgrade
  - jwt-token-validation
  - tps-performance-testing
  - user-login-event
  - user-registration-event
  - "`user_login_event`"
  - "`user_registration_event`"

# ─── Workflow Chain ──────────────────────────────────────────
workflows:
  - wf_feature_research
  - wf_pre_openspec
  - wf_brainstorm_openspec
  - wf_openspec
  - wf_openspec_apply
  - wf_archive

# ─── Settings Override ──────────────────────────────────────
settings:
  max_retries: 3
  retry_backoff_base: 20
  retry_jitter: true
  context_max_tokens: 8000
  memory_max_items: 30
  output_dir: "openspec"
  memory_dir: ".memory"

# ─── Tools Override ─────────────────────────────────────────
tools:
  enabled: true
  include_write: true
  include_exec: true
  command_timeout: 120
  max_turns: 50
  max_output_tokens: 16384
  allowed_commands:
    - "gradle"
    - "gradlew"
    - "./gradlew"
    - "find"
    - "grep"
    - "cat"
    - "ls"
    - "mvn"
    - "node"

# ─── Proxy Configuration ────────────────────────────────────
proxy:
  enabled: true
  base_url: "http://127.0.0.1:8045"
  fallback_to_direct: false
  timeout_seconds: 180
  health_check_cache_seconds: 60
  model_routing:
    wf_feature_research: "claude"
    wf_pre_openspec: "claude"
    wf_brainstorm_openspec: "claude"
    wf_openspec: "claude"
    wf_openspec_apply: "claude"
    wf_archive: "claude"
