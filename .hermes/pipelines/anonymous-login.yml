# Pipeline: anonymous-login
# Purpose: Optimize login flow with anonymous/guest authentication
# Scope: Full lifecycle — research → brainstorm → spec → apply
# Created: 2026-08-17
# Description:
#   Implement temporary anonymous user authentication that allows
#   operations like temporary cart, then seamlessly transfers session
#   data to authenticated user ID after login.

features:
  - anonymous-login-optimization

workflows:
  - wf_feature_research
  - wf_brainstorm_openspec
  - wf_openspec
  - wf_openspec_apply

settings:
  progress_file: "openspec/changes/anonymous-login-optimization/pipeline_progress.yml"

proxy:
  model_routing:
    wf_feature_research: "claude"
    wf_brainstorm_openspec: "claude"
    wf_openspec: "claude"
    wf_openspec_apply: "claude"

# Disable agentic tools — proxy (antigravity-ultra) does not support
# multi-turn tool_result messages in streaming mode.
tools:
  enabled: false
  max_output_tokens: 65536
