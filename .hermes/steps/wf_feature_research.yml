# Step config for wf_feature_research
id: wf_feature_research
name: "Feature Research"
description: "Research and analysis phase for anonymous/guest authentication optimization"
required: true
skip: false
depends_on: []

# Custom input passed to prompt Layer 4
input:
  seed_prompt: >
    Research anonymous/guest authentication patterns for enterprise IAM systems.
    Focus on: temporary anonymous sessions, session promotion (merging anonymous
    session data into authenticated user after login), guest cart management,
    seamless authentication upgrade flow, and anonymous-to-authenticated data
    transfer. Include Spring Boot + Redis + JWT implementation patterns.
  feature_name: "anonymous-login-optimization"
  technology_scope: "Spring Boot, Kotlin, Redis, PostgreSQL, JWT"
  research_goals: >
    1. How do enterprise IAM systems handle anonymous/guest users with temporary sessions?
    2. What are best practices for session promotion (anonymous → authenticated)?
    3. How to seamlessly transfer temporary data (cart, preferences) after login?
    4. Anonymous token generation and lifecycle management patterns.
    5. Security considerations for anonymous sessions (rate limiting, abuse prevention).

# Override headless rules (leave empty for default)
headless_rules: ""

# Output validation rules
validation:
  required_files:
    - "openspec/research/{feature}/research_brief.md"
    - "openspec/research/{feature}/opensource_findings.md"
    - "openspec/research/{feature}/web_research.md"
    - "openspec/research/{feature}/comparison_analysis.md"
    - "openspec/research/{feature}/business_analysis.md"
    - "openspec/research/{feature}/technical_spec.md"
    - "openspec/research/{feature}/validation_report.md"
    - "openspec/research/{feature}/handoff_summary.md"
  min_size_bytes: 2000
