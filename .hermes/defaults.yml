# Base config inherited by all pipeline configs
# Proxy settings for Google Cloud Code gateway
proxy:
  enabled: true
  base_url: "http://127.0.0.1:8045"
  api_key: "sk-fbfab2cd5b69496c829964f35980e4ce"

# SDK mode: claude (with raw stream parsing for Google proxy format)
sdk_mode: claude

# Default model for all workflows
model: "claude-opus-4-6-thinking"

# Max tokens per request (research output is large, needs more than default 16384)
max_tokens: 32768

# System prompt path
system_prompt: "prompts/system_identity.md"

# MCP servers
mcp_servers:
  socraticode:
    enabled: true
  gitnexus:
    enabled: true
  postgres:
    enabled: true

# Retry settings
retry:
  max_strikes: 2
  backoff_base: 16

# Agentic loop settings
agentic:
  max_turns: 30
  tool_timeout: 120
