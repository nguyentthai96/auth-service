# Auth-service i18n messages (Vietnamese)
# Keys match AuthErrorCode.msgCode values exactly

# Authentication errors
auth.invalid_credentials=Sai tên đăng nhập hoặc mật khẩu
auth.account_locked=Tài khoản bị khóa do đăng nhập sai quá nhiều lần
auth.token_expired=Token đã hết hạn
auth.permission_denied=Không đủ quyền truy cập
auth.resource_not_found=Không tìm thấy tài nguyên
auth.duplicate_resource=Tài nguyên đã tồn tại

# CAPTCHA errors
auth.captcha_required=Yêu cầu xác minh CAPTCHA
auth.captcha_failed=Xác minh CAPTCHA thất bại

# Policy errors
auth.policy_evaluation_failed=Đánh giá chính sách thất bại
auth.write_not_allowed=Không được phép thực hiện ghi

# MFA errors
auth.mfa_code_invalid=Mã xác minh MFA không hợp lệ
auth.mfa_token_expired=Phiên xác minh MFA đã hết hạn
auth.mfa_max_attempts=Đã vượt quá số lần xác minh MFA cho phép
auth.mfa_rate_limited=Đã vượt quá giới hạn tốc độ xác minh MFA

# SSO errors
auth.sso_token_invalid=Trao đổi token SSO thất bại
auth.sso_user_not_provisioned=Người dùng SSO chưa được cấp quyền
auth.sso_identity_conflict=Danh tính SSO đã được liên kết

# Password errors
auth.password_policy_violation=Mật khẩu không đáp ứng yêu cầu
auth.password_expired=Mật khẩu đã hết hạn

# Rate limiting & session errors
auth.rate_limited=Quá nhiều lần đăng nhập
auth.session_limit=Đã đạt tối đa {0} phiên hoạt động

# Success messages
auth.login_success=Đăng nhập thành công
auth.logout_success=Đã đăng xuất thành công
auth.password_changed=Đổi mật khẩu thành công
auth.token_refreshed=Làm mới token thành công
auth.password_reset_sent=Nếu email tồn tại, liên kết đặt lại mật khẩu đã được gửi
auth.register_success=Đăng ký thành công
auth.switch_domain_success=Chuyển đổi domain thành công
auth.session_revoked=Đã thu hồi phiên
auth.all_sessions_revoked=Đã thu hồi tất cả phiên
auth.account_deactivated=Tài khoản đã bị vô hiệu hóa. Liên hệ quản trị viên để kích hoạt lại.
auth.deletion_requested=Yêu cầu xóa đã được tạo. Tài khoản sẽ bị xóa vĩnh viễn sau thời gian chờ.
auth.deletion_cancelled=Yêu cầu xóa đã được hủy. Tài khoản đã được khôi phục.

# E2EE errors
auth.e2ee_time_skew=Dấu thời gian yêu cầu nằm ngoài cửa sổ dung sai cho phép
auth.e2ee_version_unknown=Phiên bản mã hóa không xác định
auth.e2ee_context_mismatch=Ngữ cảnh mã hóa không khớp với giá trị mong đợi
auth.e2ee_replay_detected=Phát hiện yêu cầu trùng lặp (bảo vệ phát lại)
auth.e2ee_version_sunset=Phiên bản mã hóa không còn được hỗ trợ
auth.e2ee_decrypt_failed=Không thể giải mã dữ liệu yêu cầu
auth.e2ee_kms_unavailable=Dịch vụ quản lý khóa tạm thời không khả dụng
auth.e2ee_key_expired=Khóa mã hóa đã hết hạn
auth.e2ee_device_unregistered=Thiết bị chưa được đăng ký cho mã hóa đầu cuối
auth.e2ee_max_devices=Đã đạt số lượng thiết bị đăng ký tối đa

# Anonymous session errors
auth.anonymous_session_expired=Phiên ẩn danh đã hết hạn
auth.anonymous_data_limit_exceeded=Kích thước dữ liệu ({0} bytes) vượt quá giới hạn cho phép ({1} bytes)
auth.anonymous_promotion_conflict=Xung đột nâng cấp phiên ẩn danh — phiên đã được nâng cấp
auth.anonymous_rate_limited=Quá nhiều yêu cầu. Vui lòng thử lại sau {0} giây.
auth.anonymous_max_renewals=Đã đạt số lần gia hạn phiên tối đa ({0})
