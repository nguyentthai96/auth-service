# Auth-service i18n messages (English — default)
# Keys match AuthErrorCode.msgCode values exactly

# Authentication errors
auth.invalid_credentials=Invalid username or password
auth.account_locked=Account is locked due to failed login attempts
auth.token_expired=JWT token has expired
auth.permission_denied=Insufficient permissions
auth.resource_not_found=Resource not found
auth.duplicate_resource=Resource already exists

# CAPTCHA errors
auth.captcha_required=CAPTCHA verification required
auth.captcha_failed=CAPTCHA verification failed

# Policy errors
auth.policy_evaluation_failed=Policy evaluation failed
auth.write_not_allowed=Write operation not allowed

# MFA errors
auth.mfa_code_invalid=Invalid MFA verification code
auth.mfa_token_expired=MFA session token has expired
auth.mfa_max_attempts=Maximum MFA verification attempts exceeded
auth.mfa_rate_limited=MFA rate limit exceeded

# SSO errors
auth.sso_token_invalid=SSO token exchange failed
auth.sso_user_not_provisioned=SSO user not provisioned
auth.sso_identity_conflict=SSO identity already linked

# Password errors
auth.password_policy_violation=Password does not meet requirements
auth.password_expired=Password has expired

# Rate limiting & session errors
auth.rate_limited=Too many login attempts
auth.session_limit=Maximum active sessions ({0}) reached

# Success messages
auth.login_success=Login successful
auth.logout_success=Logged out successfully
auth.password_changed=Password changed successfully
auth.token_refreshed=Token refreshed successfully
auth.password_reset_sent=If the email exists, a reset link has been sent
auth.register_success=Registration successful
auth.switch_domain_success=Domain switched successfully
auth.session_revoked=Session revoked
auth.all_sessions_revoked=All sessions revoked
auth.account_deactivated=Account deactivated. Contact admin to reactivate.
auth.deletion_requested=Deletion request created. Account will be permanently deleted after grace period.
auth.deletion_cancelled=Deletion request cancelled. Account restored to active.

# E2EE errors
auth.e2ee_time_skew=Request timestamp is outside the allowed tolerance window
auth.e2ee_version_unknown=Unknown encryption version
auth.e2ee_context_mismatch=Encryption context does not match expected value
auth.e2ee_replay_detected=Duplicate request detected (replay protection)
auth.e2ee_version_sunset=Encryption version is no longer supported
auth.e2ee_decrypt_failed=Failed to decrypt the request payload
auth.e2ee_kms_unavailable=Key management service is temporarily unavailable
auth.e2ee_key_expired=Encryption key has expired
auth.e2ee_device_unregistered=Device is not registered for end-to-end encryption
auth.e2ee_max_devices=Maximum number of registered devices reached

# Anonymous session errors
auth.anonymous_session_expired=Anonymous session has expired
auth.anonymous_data_limit_exceeded=Data size ({0} bytes) exceeds the maximum allowed ({1} bytes)
auth.anonymous_promotion_conflict=Anonymous session promotion conflict — session already promoted
auth.anonymous_rate_limited=Too many requests. Please try again in {0} seconds.
auth.anonymous_max_renewals=Maximum session renewals ({0}) reached
