# Auth-service i18n messages (English — default)
# Keys match AuthErrorCode.msgCode values exactly

# Authentication errors
auth.invalid_credentials=Invalid username or password
auth.account_locked=Account is locked due to failed login attempts
auth.token_expired=JWT token has expired
auth.permission_denied=Insufficient permissions
auth.resource_not_found=Resource not found
auth.duplicate_resource=Resource already exists

# CAPTCHA errors
auth.captcha_required=CAPTCHA verification required
auth.captcha_failed=CAPTCHA verification failed

# Policy errors
auth.policy_evaluation_failed=Policy evaluation failed
auth.write_not_allowed=Write operation not allowed

# MFA errors
auth.mfa_code_invalid=Invalid MFA verification code
auth.mfa_token_expired=MFA session token has expired
auth.mfa_max_attempts=Maximum MFA verification attempts exceeded
auth.mfa_rate_limited=MFA rate limit exceeded

# SSO errors
auth.sso_token_invalid=SSO token exchange failed
auth.sso_user_not_provisioned=SSO user not provisioned
auth.sso_identity_conflict=SSO identity already linked

# Password errors
auth.password_policy_violation=Password does not meet requirements
auth.password_expired=Password has expired

# Rate limiting & session errors
auth.rate_limited=Too many login attempts
auth.session_limit=Maximum active sessions ({0}) reached

# Success messages
auth.login_success=Login successful
auth.logout_success=Logged out successfully
auth.password_changed=Password changed successfully
auth.token_refreshed=Token refreshed successfully
auth.password_reset_sent=If the email exists, a reset link has been sent
