base-core:
  snowflake:
    node-id: -1    # -1 = auto-detect from hostname
    epoch: 1704067200000  # 2024-01-01T00:00:00Z

app:
  cipher:
    enabled: false
    http:
      enabled: false
      order: 50
      exclude-paths:
        - /actuator/**
        - /auth/key-exchange
        - /health
        - /v3/api-docs/**
    anti-replay:
      enabled: true
      window-seconds: 300          # ±5 minutes tolerance
      initial-window-seconds: 600  # ±10 minutes for first request
      nonce-ttl-seconds: 600       # 10 minutes nonce dedup TTL
      nonce-cache-prefix: "cipher:nonce:"
    key-exchange:
      enabled: true
      session-ttl: 86400000        # 24 hours (ms)
      max-devices-per-user: 5
      rotation-grace-period: 7200000 # 2 hours
    signing:
      enabled: true
    cache:
      l1-max-size: 500
      l1-expire-after-write: 5m
      l2-ttl: 30m
    timeout:
      key-lookup-ms: 500
      policy-lookup-ms: 200
    retry:
      key-session-store-max-attempts: 3
    key:
      app-key-id: ${CIPHER_APP_KEY_ID:auth-service-cipher-key}
