spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth_user
    password: auth_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

server:
  port: 8081

# Base-Core Configuration
base-core:
  snowflake:
    node-id: -1    # -1 = auto-detect from hostname
    epoch: 1704067200000  # 2024-01-01T00:00:00Z

# JWT Configuration
app:
  security:
    enabled: true
    jwt:
      secret-key: "your-256-bit-secret-key-change-in-production"
      access-token-expiration-ms: 1800000   # 30 minutes
      refresh-token-expiration-ms: 604800000 # 7 days
      issuer: "auth-service"
    password:
      bcrypt-strength: 12
      max-failed-attempts: 3
      lock-duration-minutes: 15

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ntt.authservice: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
