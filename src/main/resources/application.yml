spring:
  application:
    name: auth-service
  docker:
    compose:
      enabled: false

  config:
    import:
      # Base-core shared config (logging, filter chain, security, observability, cipher, etc.)
      - classpath:application-base-core.yml
      # Legacy split configs (will be migrated into base-core shared config)
      - optional:classpath:application-core-observability.yml
      - optional:classpath:application-core-logging.yml
      - optional:classpath:application-core-resilience.yml
      - optional:classpath:application-core-cipher.yml
      # Service-specific configs
      - classpath:application-db.yml
      - classpath:application-security.yml
      - classpath:application-cache.yml
      - optional:classpath:application-notification.yml
      - optional:classpath:application-elasticsearch.yml

server:
  port: 8081

# ── Auth-service overrides ──────────────────────────────────────────
logging:
  level:
    com.ntt.authservice: DEBUG
    org.hibernate.SQL: DEBUG

management:
  metrics:
    tags:
      application: auth-service
