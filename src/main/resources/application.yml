spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: auth-service

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth_user
    password: auth_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

  # Redis for OTP and MFA state
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # OAuth2 SSO Client Registrations
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-secret}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID:placeholder-microsoft-client-id}
            client-secret: ${MICROSOFT_CLIENT_SECRET:placeholder-microsoft-secret}
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Microsoft
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys

server:
  port: 8081

# Base-Core Configuration
base-core:
  snowflake:
    node-id: -1    # -1 = auto-detect from hostname
    epoch: 1704067200000  # 2024-01-01T00:00:00Z

# CORS Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Event Sourcing Configuration
  event:
    source: auth-service
    outbox:
      poll-interval-ms: 100
      batch-size: 50
      max-retries: 3
      kafka-timeout-ms: 5000
  security:
    enabled: true
    jwt:
      secret-key: ${JWT_SECRET_KEY:your-256-bit-secret-key-change-in-production}
      algorithm: ${JWT_ALGORITHM:RS256}
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      key-id: ${JWT_KEY_ID:auth-service-key-1}
      access-token-expiration-ms: 900000     # 15 minutes (sliding window)
      refresh-token-expiration-ms: 604800000 # 7 days
      absolute-ceiling-ms: 36000000          # 10 hours absolute session limit
      issuer: "auth-service"
    password:
      bcrypt-strength: 12
      max-failed-attempts: 3
      lock-duration-minutes: 15
    mfa:
      otp-ttl-seconds: 300         # 5 minutes
      max-attempts: 3
      totp-window: 1               # ±1 step drift tolerance
      mfa-token-ttl-seconds: 300   # MFA challenge token TTL
      trusted-device-ttl-days: 30
      # MFA Rate Limiting
      rate-limit:
        otp:
          max-attempts: 5          # Max OTP verify failures in window
          window-seconds: 900      # 15 minutes
          lock-seconds: 1800       # 30 minutes lock
        login:
          max-attempts: 10         # Max MFA login failures in window
          window-seconds: 3600     # 1 hour
          lock-seconds: 3600       # 1 hour lock
        redis-timeout-ms: 500      # Timeout for rate limit Redis calls
    captcha:
      provider: ${CAPTCHA_PROVIDER:noop}   # noop | turnstile | hcaptcha | recaptcha | altcha
      secret-key: ${CAPTCHA_SECRET_KEY:}
      site-key: ${CAPTCHA_SITE_KEY:}
      verify-url: ${CAPTCHA_VERIFY_URL:}
      altcha:
        hmac-key: ${ALTCHA_HMAC_KEY:change-this-in-production-min-32-chars}
        difficulty: 50000               # SHA-256 iterations for PoW
        challenge-ttl-seconds: 300      # Challenge expires after 5 minutes
    sso:
      enabled: ${SSO_ENABLED:false}
      auto-provision-enabled: ${SSO_AUTO_PROVISION:false}
      default-domain-code: ${SSO_DEFAULT_DOMAIN:default}
      timeout-ms: 10000
      providers:
        google:
          token-endpoint: https://oauth2.googleapis.com/token
          user-info-endpoint: https://openidconnect.googleapis.com/v1/userinfo
        microsoft:
          token-endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
          user-info-endpoint: https://graph.microsoft.com/oidc/userinfo
        keycloak:
          token-endpoint: ${KEYCLOAK_TOKEN_ENDPOINT:http://localhost:8080/realms/master/protocol/openid-connect/token}
          user-info-endpoint: ${KEYCLOAK_USERINFO_ENDPOINT:http://localhost:8080/realms/master/protocol/openid-connect/userinfo}
    # Login Rate Limiting (multi-dimensional)
    login-rate-limit:
      ip:
        max-attempts: 5            # Max login attempts per IP per window
        window-seconds: 60         # 1 minute window
        lock-seconds: 300          # 5 minutes lock
      username:
        max-attempts: 3            # Max login attempts per username per window
        window-seconds: 900        # 15 minutes window
        lock-seconds: 1800         # 30 minutes lock
      device:
        max-attempts: 10           # Max login attempts per device per window
        window-seconds: 3600       # 1 hour window
        lock-seconds: 3600         # 1 hour lock
      redis-timeout-ms: 500
    # Session Management
    session:
      max-sessions: 3              # Max active sessions per user
      max-devices: 3               # Max devices per user
      on-exceed: REVOKE_OLDEST     # REVOKE_OLDEST | REJECT_NEW | REVOKE_ALL
      inactivity-timeout-minutes: 30   # Auto-expire after 30 min inactive
      cleanup-cron-expression: "0 */5 * * * *"  # Run cleanup every 5 min
      role-overrides:
        SUPER_ADMIN:
          max-sessions: 1
          on-exceed: REVOKE_ALL
    # Anonymous/Guest Session Configuration
    anonymous:
      token-ttl-seconds: ${ANON_TOKEN_TTL:3600}           # 1 hour
      session-ttl-seconds: ${ANON_SESSION_TTL:86400}       # 24 hours
      max-data-size-bytes: ${ANON_MAX_DATA_SIZE:65536}     # 64KB
      max-renewals: ${ANON_MAX_RENEWALS:24}
      promoted-data-ttl-seconds: ${ANON_PROMOTED_TTL:604800} # 7 days
      rate-limit:
        max-attempts: 5            # Max anonymous token creations per IP per window
        window-seconds: 3600       # 1 hour window
        lock-seconds: 0            # No lock — just reject until window expires
    # CQRS Feature Flag — when enabled, handlers replace AuthService/RbacEngine
    cqrs:
      enabled: ${CQRS_ENABLED:true}
    # Cache Configuration (Phase 4)
    cache:
      permission:
        l1-ttl-seconds: 30       # Caffeine local cache
        l1-max-size: 10000
        l2-ttl-seconds: 1800     # Redis distributed cache (30 min)
        l2-key-prefix: "auth:perm:"
    # E2EE Configuration — maps to CipherProperties (base-security-starter)
    cipher:
      enabled: true
      http:
        enabled: true
        order: 50
        exclude-paths:
          - /actuator/**
          - /auth/key-exchange
          - /health
          - /v3/api-docs/**
      anti-replay:
        enabled: true
        window-seconds: 300          # ±5 minutes tolerance
        initial-window-seconds: 600  # ±10 minutes for first request
        nonce-ttl-seconds: 600       # 10 minutes nonce dedup TTL
        nonce-cache-prefix: "cipher:nonce:"
      key-exchange:
        enabled: true
        session-ttl: 86400000        # 24 hours (ms)
        max-devices-per-user: 5
        rotation-grace-period: 7200000 # 2 hours
      signing:
        enabled: true
      cache:
        l1-max-size: 500
        l1-expire-after-write: 5m
        l2-ttl: 30m
      timeout:
        key-lookup-ms: 500
        policy-lookup-ms: 200
      retry:
        key-session-store-max-attempts: 3
      key:
        app-key-id: ${CIPHER_APP_KEY_ID:auth-service-cipher-key}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ntt.authservice: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

# Resilience4j Circuit Breaker Configuration (FR-019)
resilience4j:
  circuitbreaker:
    instances:
      ssoProvider:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      captchaProvider:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
