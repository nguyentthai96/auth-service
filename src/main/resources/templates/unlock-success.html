<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở khóa thành công</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 40px 20px; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 40px; text-align: center; }
        h1 { color: #2d6a4f; font-size: 24px; margin-bottom: 16px; }
        p { color: #555; line-height: 1.6; margin-bottom: 24px; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        .btn { display: inline-block; padding: 14px 40px; background: #2d6a4f; color: #fff; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Tài khoản đã được mở khóa</h1>
        <p>Tài khoản của bạn đã được mở khóa thành công. Bạn có thể đăng nhập lại ngay bây giờ.</p>
        <a href="/login" class="btn">Đăng nhập</a>
    </div>
</body>
</html>
