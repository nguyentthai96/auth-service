<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở khóa không thành công</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 40px 20px; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 40px; text-align: center; }
        h1 { color: #c1121f; font-size: 24px; margin-bottom: 16px; }
        p { color: #555; line-height: 1.6; margin-bottom: 24px; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        .error-msg { background: #fff0f0; border: 1px solid #ffc2c2; border-radius: 8px; padding: 16px; color: #c1121f; margin-bottom: 24px; }
        .help { font-size: 14px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">❌</div>
        <h1>Mở khóa không thành công</h1>
        <div class="error-msg" th:text="${errorMessage}">Đã xảy ra lỗi.</div>
        <p class="help">Nếu bạn cần hỗ trợ, vui lòng liên hệ quản trị viên hệ thống.</p>
    </div>
</body>
</html>
